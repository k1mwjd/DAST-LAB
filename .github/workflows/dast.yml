name: DAST scan

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    zap-scan:
        runs-on: ubuntu-latest     # 생성할 VM
        timeout-minutes: 40        # 작업이 40분을 넘어가면 강제 종료

        services:
            db:
                image: mariadb:10  # VM이 사용할 image를 외부 db에서 받아옴
                env:
                    MYSQL_ROOT_PASSWORD: dvwa
                    MYSQL_DATABASE: dvwa
                    MYSQL_USER: dvwa
                    MYSQL_PASSWORD: p@ssw0rd
                options: >-
                    --health-cmd "healthcheck.sh --connect --innodb_initialized"
                    --health-interval 5s --health-timeout 5s --health-retries 30
            dvwa:
                image: ghcr.io/digininja/dvwa:latest
                env:
                    DB_SERVER: db
                ports:
                    - '127.0.0.1:4280:80'
        env:
            TARGET: http://127.0.0.1:4280
            SECURITY_LEVEL: low
            MAX_HIGH: 0
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.12'

            - name: Install Python packages
              run: pip install zaproxy requests

            - name: Generate a one-time ZAP API key
              run: |
                  key=$(openssl rand -hex 32)
                  echo "::add-mask::$key"
                  echo "ZAP_API_KEY=$key" >> "$GITHUB_ENV"

            - name: Start ZAP in daemon mode
              run: |
                  docker run -d --name zap --network host \
                      ghcr.io/zaproxy/zaproxy:stable \
                      zap.sh -daemon -host 127.0.0.1 -port 8080 \
                      -config api.key="$ZAP_API_KEY"
                  for i in $(seq 1 30); do
                      if curl -fs --max-time 5 "http://127.0.0.1:8080/JSON/core/view/version/?apikey=$ZAP_API_KEY" > /dev/null; then
                          exit 0
                      fi
                      sleep 5
                  done
                  echo "ZAP did not become ready" >&2
                  exit 1

            - name: Initialize DVWA database
              run: python ci/setup_dvwa.py

            - name: Run ZAP scan and quality gate
              run: python ci/zap_scan.py

            - name: Upload ZAP scan reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: zap-reports
                  path: |
                      zap-report.html
                      zap-alerts.json

            - name: Show ZAP log on failure
              if: failure()
              run: docker logs zap | tail -n 50
